# Repository-owned defaults only. Jujutsu submissions always use the complete
# pinned @ tree. Keep endpoint and credential paths in environment variables or
# CLI flags. Reusable servers conventionally expose `repo_check` and
# `repo_session`; this repository defines `indentured:check` in devenv.nix.
[connection]
enabled = true
local_fallback = false

[output]
stdout_max_lines = 500
stderr_max_lines = 500
stdout_tail_lines = 40
stderr_tail_lines = 40
