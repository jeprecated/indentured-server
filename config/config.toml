schema_version = "11"

[service]
# Immediate admission control; excess authenticated requests receive HTTP 503.
max_concurrent_builds = 1

[service.socket]
# Disabled by default. When explicitly enabled, socket filesystem permissions
# are the entire authority boundary; the task identity must not be able to connect.
enabled = false
path = "/run/indentured-server/control/server.sock"
mode = "0600"

[service.http]
enabled = true
listen_addr = "127.0.0.1:8080"

[service.http.auth]
type = "bearer"
required = true
# Runtime files contain one token each, mode 0600, outside repositories/Nix store.
token_files = ["/run/credentials/indentured-server.service/bearer-token"]

[service.http.tls]
enabled = false
# Optional server-side transport encryption only; clients are authenticated by bearer token.
# cert_path = "/etc/indentured-server/tls/server.crt"
# key_path = "/etc/indentured-server/tls/server.key"

[build]
workspace_root = "/var/lib/indentured-server/workspaces"
max_timeout_sec = 1800
max_output_bytes = 67108864
run_as_user = "indentured-build"
run_as_group = "indentured-build"

[tasks.build]
script = '''
printf 'starting build\n'
make -j4 all
'''
cwd = "."
timeout_sec = 600
workspace = "fresh"

# Optional preparation command; filesystem changes remain for the run command.
[tasks.build.setup]
script = "printf 'preparing environment\\n'"
timeout_sec = 300

[tasks.build.environment]
PATH = "/usr/bin:/bin"
LANG = "C.UTF-8"

[tasks.build.artifacts]
include = ["out/**"]
exclude = ["out/**/*.tmp"]

# Reusable host profile: each repository owns its `indentured:check` task.
[tasks.repo_check]
script = "exec devenv tasks run indentured:check"
cwd = "."
timeout_sec = 1800
workspace = "fresh"

[tasks.repo_check.environment]
PATH = "/run/current-system/sw/bin:/usr/bin:/bin"
LANG = "C.UTF-8"

[tasks.repo_check.artifacts]
include = []
exclude = []

# A session selects exactly one action mode. This sample uses one fixed
# repository dispatcher; use [tasks.repo_session.session.actions.<name>]
# instead when each action must remain operator-owned or needs its own policy.
[tasks.repo_session]
script = "exec devenv tasks run indentured:session:start"
cwd = "."
timeout_sec = 600
workspace = "fresh"

[tasks.repo_session.setup]
script = "exec devenv tasks run indentured:session:setup"
timeout_sec = 600

[tasks.repo_session.environment]
PATH = "/run/current-system/sw/bin:/usr/bin:/bin"
LANG = "C.UTF-8"

[tasks.repo_session.artifacts]
include = [".indentured-output/final/**"]
exclude = []

[tasks.repo_session.session]
idle_timeout_sec = 900
max_lifetime_sec = 14400

# Optional bounded authority to replace/delete only operator-allowed regular files.
[tasks.repo_session.session.source_updates]
timeout_sec = 120
max_transfer_bytes = 67108864
max_uncompressed_bytes = 268435456
max_files = 10000
max_depth = 64
include = ["**"]
exclude = [".indentured/**", ".indentured-output/**"]

[tasks.repo_session.session.teardown]
script = "exec devenv tasks run indentured:session:stop"
timeout_sec = 120

[tasks.repo_session.session.action_dispatcher]
script = "exec devenv tasks run indentured:session:action"
timeout_sec = 120
# Compatibility default: arbitrary valid names use the dispatcher defaults.
allow_unlisted = true

[tasks.repo_session.session.action_dispatcher.artifacts]
include = [".indentured-output/action/**"]
exclude = []

# Optional policy-only per-name overrides inherit omitted dispatcher defaults.
[tasks.repo_session.session.action_dispatcher.actions.observe]
timeout_sec = 60

[sources]
max_transfer_bytes = 134217728
max_uncompressed_bytes = 1342177280
max_files = 50000
max_depth = 64
upload_timeout_sec = 120

[artifacts]
storage_root = "/var/lib/indentured-server/artifacts"
# ttl_sec = 86400
# gc_interval_sec = 3600
# max_bytes = 1073741824
max_transfer_bytes = 536870912
max_uncompressed_bytes = 2147483648
max_files = 10000
max_depth = 64
# restricted_patterns = ["*.key", "**/*.key"]

[logging]
level = "info"
directory = "/var/log/indentured-server"
max_bytes = 104857600
max_files = 5
console = false
